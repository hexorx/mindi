pid /run/user/1000/nginx.pid;
# Use the inherited descriptor; reopening /dev/stderr fails after dropping root.
error_log stderr warn;
worker_processes 1;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /run/user/1000/client;
    proxy_temp_path /run/user/1000/proxy;
    fastcgi_temp_path /run/user/1000/fastcgi;
    uwsgi_temp_path /run/user/1000/uwsgi;
    scgi_temp_path /run/user/1000/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_origin $request_origin { default $http_origin; "" "$scheme://$http_host"; }
    server {
        listen 8443 ssl;
        ssl_certificate /run/user/1000/tls.crt;
        ssl_certificate_key /run/user/1000/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($request_origin != "$scheme://$http_host") { return 403; }
        auth_basic "Agent desktop";
        auth_basic_user_file /run/user/1000/htpasswd;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # The gateway validates Bearer auth; desktop keeps its separate Basic auth.
        location ~ ^/(health(/detailed)?|v1/health|v1/runs|v1/run-reservations/stop|v1/runs/run_[a-zA-Z0-9]+(/(events|stop|approval|steer))?)$ {
            auth_basic off;
            proxy_pass http://127.0.0.1:8642;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }
        # No alternate chat, jobs, callbacks, cron or profile inference ingress.
        location ~ ^/(v1|api|health|p)(/|$) { return 403; }
        location / {
            proxy_pass http://127.0.0.1:6080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
