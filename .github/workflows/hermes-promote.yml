name: Hermes private subscription release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hermes-ghcr-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'hexorx/mindi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse public packages and existing immutable tags
        run: python3 -B scripts/hermes-release/publish.py preflight
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      - name: Install registry transport
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y skopeo
      - name: Build once without model credentials
        run: |
          docker build --platform linux/amd64 -t agent-box-base:local -f apps/agent-box/base/infra/agent-box/Dockerfile apps/agent-box/base
          docker build --platform linux/amd64 --build-arg AGENT_BOX_IMAGE=agent-box-base:local --build-arg SOURCE_REVISION="$GITHUB_SHA" -t hermes-release:local -f apps/agent-box/backend/infra/backend-box/Dockerfile apps/agent-box/backend
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' hermes-release:local)" = "$GITHUB_SHA"
          docker save hermes-release:local -o "$RUNNER_TEMP/image.tar"
          skopeo copy "docker-archive:$RUNNER_TEMP/image.tar" "oci-archive:$RUNNER_TEMP/image.oci.tar:sha-$GITHUB_SHA"
      - name: Scan every layer and config/history for secrets
        run: python3 -B scripts/hermes-release/scan_layers.py "$RUNNER_TEMP/image.tar" "$RUNNER_TEMP/secrets-summary.json"
      - name: Basic offline startup and desktop smoke
        run: python3 -B apps/agent-box/test/smoke.py hermes-release:local
      - name: Informational SBOM
        continue-on-error: true
        run: trivy image --input "$RUNNER_TEMP/image.tar" --format cyclonedx --output "$RUNNER_TEMP/sbom.cdx.json"
      - name: Informational vulnerability scan
        continue-on-error: true
        run: trivy image --input "$RUNNER_TEMP/image.tar" --scanners vuln --format json --output "$RUNNER_TEMP/vulnerabilities.json" --exit-code 0
      - name: Push exact digest to private package
        env:
          GHCR_TOKEN: ${{ github.token }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          python3 -B scripts/hermes-release/publish.py publish "$RUNNER_TEMP/image.oci.tar" "$RUNNER_TEMP/receipt.json"
          cat "$RUNNER_TEMP/receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve informational reports and receipt (never auth or container logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/secrets-summary.json
            ${{ runner.temp }}/sbom.cdx.json
            ${{ runner.temp }}/vulnerabilities.json
            ${{ runner.temp }}/receipt.json
          if-no-files-found: ignore
