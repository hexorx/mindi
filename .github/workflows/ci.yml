name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: python -m pip install -r apps/agent-box-hermes/requirements-test.txt
      - name: Verify uv notice coverage and upstream bytes
        run: python3 apps/agent-box-hermes/build/verify_uv_notices.py docs/third-party/hex263-uv-inputs
      - name: License reconciliation bound classifications
        run: python3 -B -m unittest discover -s scripts/hermes-release -p 'test_*.py' -v
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  original-box:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: python3 -B -m unittest discover -s apps/agent-box/test -p 'test_*.py' -v
      - name: Verify persistent-home ownership upgrade as root
        run: sudo python3 -B -m unittest discover -s apps/agent-box/test -p 'test_subscription.py' -v
      - name: Verify operator home UID upgrade and rollback as root
        run: sudo python3 -B -m unittest discover -s apps/agent-box/test -p 'test_home_migration.py' -v
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: apps/agent-box/backend
      - run: pnpm exec turbo run build lint --filter=@mindi/backend...
        working-directory: apps/agent-box/backend
