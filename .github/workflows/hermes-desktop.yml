name: Hermes desktop
on:
  pull_request:
    paths:
      - apps/agent-box-hermes/**
      - stacks/agent-box-hermes/**
      - .github/workflows/hermes-desktop.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    # HEX-345 requires exact-head review and green source CI before Opi builds.
    if: github.event_name != 'pull_request' || github.head_ref != 'codi/hex-342-chromium-expat-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build clean linux/amd64 image
        run: |
          source_revision=$(git rev-parse HEAD)
          docker buildx build --platform linux/amd64 --build-arg SOURCE_REVISION="$source_revision" --load -t hermes-desktop:smoke -f apps/agent-box-hermes/Dockerfile .
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' hermes-desktop:smoke)" = "$source_revision"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.hexorx.source-companion.url" }}' hermes-desktop:smoke)" = "https://github.com/hexorx/mindi/releases/tag/hermes-source-$source_revision"
      - name: Fresh-volume offline startup and cached tokenizers
        run: apps/agent-box-hermes/test/offline-startup-smoke.sh hermes-desktop:smoke
      - name: Preserve offline startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-startup-evidence
          path: |
            ${{ runner.temp }}/hermes-offline.*/container.log
            ${{ runner.temp }}/hermes-offline.*/container-inspect.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Authenticate, exercise real computer-use, stop gracefully
        run: apps/agent-box-hermes/test/container-smoke.sh hermes-desktop:smoke
      - name: Userspace Tailscale enrollment, identity, revocation and exposure
        run: apps/agent-box-hermes/test/tailscale-smoke.sh hermes-desktop:smoke
