services:
  hermes:
    build:
      context: .
      dockerfile: apps/agent-box-hermes/Dockerfile
      args:
        SOURCE_REVISION: ${MINDI_SOURCE_REVISION:?Set MINDI_SOURCE_REVISION to the full built source commit}
    environment:
      API_SERVER_KEY: ${API_SERVER_KEY:?Set API_SERVER_KEY}
      PAPERCLIP_CALLBACK_KEY: ${PAPERCLIP_CALLBACK_KEY:?Set PAPERCLIP_CALLBACK_KEY}
      PAPERCLIP_API_URL: ${PAPERCLIP_API_URL:?Set PAPERCLIP_API_URL}
      HERMES_INFERENCE_PROVIDER: ${HERMES_INFERENCE_PROVIDER:-openai-codex}
      HERMES_INFERENCE_MODEL: ${HERMES_INFERENCE_MODEL:-}
    platform: linux/amd64
    expose:
      - "8443"
    volumes:
      - box-home:/home/agent
      - box-memory:/var/lib/agent-box/hindsight
    secrets:
      - desktop_password
      - desktop_tls_cert
      - desktop_tls_key
    cpus: 4
    mem_limit: 8g
    shm_size: 2gb
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
secrets:
  desktop_password:
    file: ${DESKTOP_PASSWORD_FILE:?Set DESKTOP_PASSWORD_FILE}
  desktop_tls_cert:
    file: ${DESKTOP_TLS_CERT_FILE:?Set DESKTOP_TLS_CERT_FILE}
  desktop_tls_key:
    file: ${DESKTOP_TLS_KEY_FILE:?Set DESKTOP_TLS_KEY_FILE}
volumes:
  box-home:
  box-memory:
