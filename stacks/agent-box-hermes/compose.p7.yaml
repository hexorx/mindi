services:
  hermes:
    build:
      context: ../..
      dockerfile: apps/agent-box-hermes/Dockerfile
    environment:
      API_SERVER_KEY: ${API_SERVER_KEY:?Set API_SERVER_KEY}
      PAPERCLIP_CALLBACK_KEY: ${PAPERCLIP_CALLBACK_KEY:?Set PAPERCLIP_CALLBACK_KEY}
      PAPERCLIP_API_URL: ${PAPERCLIP_API_URL:?Set PAPERCLIP_API_URL}
    platform: linux/amd64
    expose:
      - "8443"
    volumes:
      - box-home:/home/agent
      - box-memory:/var/lib/agent-box/hindsight
    secrets:
      - memory_llm_key
      - memory_embeddings_key
      - desktop_password
      - desktop_tls_cert
      - desktop_tls_key
    shm_size: 256mb
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
secrets:
  memory_llm_key:
    file: ${MEMORY_LLM_KEY_FILE:?Set MEMORY_LLM_KEY_FILE}
  memory_embeddings_key:
    file: ${MEMORY_EMBEDDINGS_KEY_FILE:?Set MEMORY_EMBEDDINGS_KEY_FILE}
  desktop_password:
    file: ${DESKTOP_PASSWORD_FILE:?Set DESKTOP_PASSWORD_FILE}
  desktop_tls_cert:
    file: ${DESKTOP_TLS_CERT_FILE:?Set DESKTOP_TLS_CERT_FILE}
  desktop_tls_key:
    file: ${DESKTOP_TLS_KEY_FILE:?Set DESKTOP_TLS_KEY_FILE}
volumes:
  box-home:
  box-memory:
